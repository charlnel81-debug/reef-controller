name: ESPHome Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.8.0

      - name: Compile ESPHome
        run: esphome compile test.yaml

      - name: Find firmware
        run: |
          echo "=== Searching for firmware files ==="
          find . -type f \( -name "*.bin" -o -name "*.elf" \) -print
          echo "=== Build directory ==="
          find .esphome -maxdepth 6 -type f -print

      -       - name: Locate firmware
        run: |
          echo "=== ALL BIN FILES ==="
          find . -type f -name "*.bin" -print
          echo "=== ESPHOME BUILD DIRECTORY ==="
          find .esphome -type f -print

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: reef-test-firmware
          path: |
            .esphome/build/reef-test/**/firmware.bin
            .esphome/build/reef-test/**/firmware.factory.bin
          if-no-files-found: warn:
