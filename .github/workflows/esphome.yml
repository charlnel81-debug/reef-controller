name: ESPHome Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.8.0

      - name: Compile ESPHome
        run: esphome compile test.yaml

      - name: Locate firmware
        run: find .esphome/build/reef-test/build -maxdepth 1 -type f -name "*.bin" -print

      - name: Prepare firmware
        run: |
          mkdir -p firmware
          cp .esphome/build/reef-test/build/reef-test.bin firmware/
          cp .esphome/build/reef-test/build/firmware.factory.bin firmware/
          ls -lh firmware/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: reef-test-firmware
          path: firmware/
